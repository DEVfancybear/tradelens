[package]
name = "tradelens-core"
description = "TradeLens domain: MT5 deals, trades, statistics, rules, storage and report importers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# The check every crate runs over its own `locales/` (see `i18n::testing`).
test-util = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
log.workspace = true
thiserror.workspace = true
rust-i18n.workspace = true
rusqlite = { version = "0.43", features = ["bundled"] }
calamine = { version = "0.38", features = ["dates"] }
csv = "1"
unicode-normalization = "0.1"
krilla = "0.8"
resvg = { version = "0.50", default-features = false, features = ["text", "raster-images"] }
base64 = "0.23"
ttf-parser = "0.25.1"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
rust_xlsxwriter = "0.103"
lopdf = "0.47"
