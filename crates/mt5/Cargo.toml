[package]
name = "tradelens-mt5"
description = "TradeLens's direct MT5 connection: a hidden portable terminal per account, driven by the MetaTrader5 Python package."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tradelens-core.workspace = true
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
rust-i18n.workspace = true
ureq = { version = "3.5", features = ["platform-verifier"] }
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tradelens-core = { workspace = true, features = ["test-util"] }
tiny_http = "0.12"
sha2 = "0.11"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
