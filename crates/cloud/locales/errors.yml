cloud.ai.off:
  vi: "AI review đang tắt"
  en: "AI review is off"
cloud.ai.prompt.intro:
  vi: "Bạn là người kèm cặp kỷ luật giao dịch. Dựa trên nhật ký tuần %{week} dưới đây, hãy:\n1. Chỉ ra tối đa 3 khuôn mẫu lặp lại (lỗi, cảm xúc, thời điểm, setup).\n2. Nêu setup nào đang hiệu quả, setup nào nên tạm dừng, kèm số liệu.\n3. Đề xuất 3 việc cụ thể cho tuần sau.\nKhông đưa ra khuyến nghị mua bán hay dự báo giá. Trả lời bằng tiếng Việt, ngắn gọn.\n"
  en: "You are a trading discipline coach. Based on the journal of week %{week} below:\n1. Point out at most 3 repeated patterns (mistakes, emotions, timing, setups).\n2. Say which setup is working and which one should be paused, with figures.\n3. Suggest 3 concrete things to do next week.\nDo not recommend buying or selling or forecast prices. Answer in English, briefly.\n"
cloud.ai.prompt.overview:
  vi: "Tổng quan: %{trades} lệnh, win rate %{win_rate}%, tổng %{total_r}R, kỳ vọng %{expectancy}R/lệnh, %{violations} vi phạm quy tắc, %{missed} lệnh bỏ lỡ (%{missed_r}R)."
  en: "Overview: %{trades} trades, win rate %{win_rate}%, total %{total_r}R, expectancy %{expectancy}R/trade, %{violations} rule violations, %{missed} missed trades (%{missed_r}R)."
cloud.ai.prompt.by_setup:
  vi: "\nTheo setup:"
  en: "\nBy setup:"
cloud.ai.prompt.setup_line:
  vi: "- %{name}: %{trades} lệnh, win %{win}%, %{r}R"
  en: "- %{name}: %{trades} trades, win %{win}%, %{r}R"
cloud.ai.prompt.mistakes:
  vi: "\nLỗi:"
  en: "\nMistakes:"
cloud.ai.prompt.mistake_line:
  vi: "- %{name}: %{times} lần, %{r}R"
  en: "- %{name}: %{times} times, %{r}R"
cloud.ai.prompt.notes:
  vi: "\nGhi chú của trader:"
  en: "\nThe trader's notes:"
