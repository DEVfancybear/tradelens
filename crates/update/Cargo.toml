[package]
name = "tradelens-update"
description = "TradeLens self-update: NSH's signed release manifests (nsh-updater) fetched over HTTPS, downloads checked and staged."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# NSH is 0.x: pin exactly, as the other nsh crates are.
nsh-updater = "=0.7.1"
ureq = "3.5"
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
tiny_http = "0.12"
tempfile = "3"
tar = "0.4"
serde_json.workspace = true
ed25519-dalek = "2.1"
base64 = "0.22"
