[workspace]
resolver = "3"
members = ["crates/core", "crates/bridge", "crates/cloud"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/DEVfancybear/tradelens"

[workspace.dependencies]
tradelens-core = { path = "crates/core" }
tradelens-bridge = { path = "crates/bridge" }
tradelens-cloud = { path = "crates/cloud" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
log = "0.4"
thiserror = "2"
# NSH is 0.x: pin exactly and upgrade on purpose.
nsh-core = "=0.6.1"
nsh-base = "=0.6.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
