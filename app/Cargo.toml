[package]
name = "nsh-app-tradelens"
description = "TradeLens desktop app: the NSH (Rust mode) UI over tradelens-core."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
tradelens-core.workspace = true
tradelens-bridge.workspace = true
tradelens-cloud.workspace = true
nsh-core.workspace = true
nsh-base.workspace = true
chrono.workspace = true
log.workspace = true
env_logger = "0.11"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "=0.6.1", default-features = false, features = ["plot", "svg", "net"] }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "=0.6.1", default-features = false, features = ["plot", "svg"] }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "=0.6.1", default-features = false, features = ["plot", "svg", "net"] }

[dev-dependencies]
nsh-engine = "=0.6.1"
nsh-testing = { version = "=0.6.1", features = ["live"] }
