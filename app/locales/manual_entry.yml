  en: "Saved the %{symbol} trade. Enter the next one."
manual_entry.trade_new:
  vi: "1 · Thông tin lệnh"
  en: "1 · Trade info"
manual_entry.trade_edit:
  vi: "Thông tin lệnh"
  en: "Trade info"
manual_entry.journal:
  vi: "2 · Nhật ký"
  en: "2 · Journal"
manual_entry.attachments:
  vi: "Ảnh & đính kèm"
  en: "Images & attachments"
manual_entry.shots:
  vi: "Ảnh chart"
  en: "Chart images"
manual_entry.attachments_note:
