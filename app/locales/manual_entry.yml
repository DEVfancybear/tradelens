# What is wrong with a field.
manual_entry.problem.symbol:
  vi: "Nhập mã giao dịch (symbol)."
  en: "Enter the trading symbol."
manual_entry.problem.positive:
  vi: "%{what} phải là số lớn hơn 0"
  en: "%{what} must be a number greater than 0"
manual_entry.problem.no_day:
  vi: "%{what} chưa chọn: bấm ô để chọn ngày, rồi gõ giờ."
  en: "%{what} is not chosen: press the box to pick a date, then type the time."
manual_entry.problem.closed_before_opened:
  vi: "Thời gian ra phải sau thời gian vào."
  en: "The exit time must be after the entry time."
