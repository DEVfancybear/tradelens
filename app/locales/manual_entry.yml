  en: "R from the stop %{r}"
manual_entry.line.empty_money:
  vi: "Tự tính: nhập thời gian vào, ra và lãi/lỗ để xem kết quả ròng và thời gian giữ."
  en: "Calculated: enter the entry and exit times and the profit/loss to see the net result and the hold time."
manual_entry.line.empty_r:
  vi: "Tự tính: nhập kết quả (R), hoặc giá vào, giá ra và stop loss để app tính R."
  en: "Calculated: enter the result (R), or the entry price, exit price and stop loss for the app to work out R."

# Editing the facts of a trade.
manual_entry.edit.title:
