  vi: "%{what} phải là một số"
  en: "%{what} must be a number"
manual_entry.problem.profit:
  vi: "Nhập lãi/lỗ của lệnh (chưa gồm commission và swap)."
  en: "Enter the trade's profit/loss (before commission and swap)."
manual_entry.problem.result_r:
  vi: "Nhập kết quả (R) của lệnh, hoặc giá vào, giá ra và stop loss để app tự tính R."
  en: "Enter the trade's result (R), or the entry price, exit price and stop loss so the app can work out R."

