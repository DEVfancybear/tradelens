  en: "Manual trade & journal entry"
manual_entry.summary:
  vi: "Cho lệnh ngoài MT5, hoặc bổ sung nhật ký cho lệnh có sẵn"
  en: "For trades outside MT5, or to add a journal to an existing trade"
manual_entry.save_next:
  vi: "Lưu & nhập tiếp"
