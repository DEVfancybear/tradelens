mt5_connect.first_time:
  vi: "Lần đầu app chép terminal MT5 cho tài khoản này (vài trăm MB), mất khoảng một phút."
  en: "The first time, the app copies an MT5 terminal for this account (a few hundred MB); it takes about a minute."
