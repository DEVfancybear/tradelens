mt5_connect.no_terminal:
  vi: "Chưa thấy MetaTrader 5 trên máy: bấm \"Cài MetaTrader 5 tự động\" ở trên (bản của MetaQuotes, đăng nhập được mọi broker), hoặc chọn terminal64.exe nếu đã cài ở chỗ khác."
  en: "MetaTrader 5 was not found on this machine: press \"Install MetaTrader 5 automatically\" above (MetaQuotes’s version, which signs in to any broker), or pick terminal64.exe if it is installed elsewhere."
