form_editor.reset.body:
  vi: "Thứ tự, tên đã đổi và thuộc tính đang ẩn của form này về như ban đầu. Thuộc tính riêng và dữ liệu đã ghi được giữ nguyên."
  en: "The order, renamed properties and hidden properties of this form go back to how they were. Your own properties and the data already written are kept."
