form_editor.kind_note.title:
  vi: "Đổi kiểu dữ liệu"
  en: "Changing the data type"
form_editor.kind_note.body:
  vi: "Chọn một → Chọn nhiều: giữ nguyên giá trị. Văn bản → Chọn một: tạo lựa chọn từ chữ đã ghi. Số → Thang điểm: làm tròn. Giá trị không chuyển được sẽ được báo trước khi đổi."
  en: "Select one → Select several: values are kept. Text → Select one: choices are made from the text written. Number → Scale: values are rounded. Values that cannot be converted are reported before the change."
form_editor.delete.title:
  vi: "Xoá thuộc tính “%{name}”?"
  en: "Delete the property “%{name}”?"
form_editor.delete.body:
  vi: "Giá trị đã ghi ở các lệnh cũ được giữ lại; thuộc tính chỉ biến khỏi form và khôi phục được ở đây."
  en: "Values written on older trades are kept; the property only disappears from the form and can be restored here."
form_editor.delete.confirm:
  vi: "Xoá thuộc tính"
  en: "Delete property"
