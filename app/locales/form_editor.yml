form_editor.shared.title:
  vi: "Danh mục lựa chọn dùng chung"
  en: "Shared choice catalogs"
form_editor.shared.body:
  vi: "Tag, lỗi, cảm xúc, lý do thoát, hạng setup, trạng thái thị trường, khung giờ, lý do không vào lệnh: thêm, đổi tên, lưu trữ trong Cài đặt → Danh mục. Xoá một lựa chọn chỉ ẩn khỏi danh sách chọn, nhật ký cũ giữ nguyên."
  en: "Tags, mistakes, emotions, exit reasons, setup grades, market conditions, timeframes, reasons for not entering: add, rename and archive them in Settings → Catalogs. Deleting a choice only hides it from the pick list; older journal entries keep it."
