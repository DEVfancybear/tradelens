_version: 2

# The Data sources screen (pages/data_sources.rs).
data_sources.summary:
  vi: "Kết nối tài khoản MT5, import báo cáo MT5, file JSON của script Python và CSV Notion."
  en: "Connect MT5 accounts, import MT5 reports, JSON files from the Python script and Notion CSV."
data_sources.python.title:
  vi: "Script Python (MetaTrader5)"
  en: "Python script (MetaTrader5)"
data_sources.python.body:
  vi: "Ghi lịch sử của terminal MT5 đang mở ra file JSON (chỉ Windows), rồi import file đó ở thẻ bên trái."
  en: "Writes the history of the open MT5 terminal to a JSON file (Windows only), then import that file in the card on the left."
data_sources.accept.reports:
  vi: "Báo cáo MT5 hoặc JSON"
  en: "MT5 report or JSON"
data_sources.accept.notion:
  vi: "CSV hoặc ZIP của Notion"
  en: "Notion CSV or ZIP"
data_sources.report.result:
  vi: "%{inserted} deal mới, %{updated} deal cập nhật, %{existing} deal đã có · tài khoản %{login}"
  en: "Deals: %{inserted} new, %{updated} updated, %{existing} already stored · account %{login}"
data_sources.report.title:
  vi: "Import báo cáo MT5"
  en: "Import MT5 report"
data_sources.report.body:
  vi: "Báo cáo MT5 (History → Report → HTML hoặc Open XML), hoặc file JSON từ script Python. Import lại cùng file không tạo trùng."
  en: "MT5 report (History → Report → HTML or Open XML), or a JSON file from the Python script. Importing the same file again creates no duplicates."
data_sources.report.drop:
  vi: "Kéo thả báo cáo MT5 vào đây"
  en: "Drop MT5 reports here"
data_sources.report.drop_hint:
  vi: "HTML, XLSX hoặc JSON · chọn được nhiều file"
  en: "HTML, XLSX or JSON · you can pick several files"
data_sources.report.importing:
  vi: "Đang nhập…"
  en: "Importing…"
data_sources.notion.title:
  vi: "Import từ Notion"
  en: "Import from Notion"
data_sources.notion.auto:
  vi: "Tự động"
  en: "Automatic"
data_sources.notion.body:
  vi: "Database → ••• → Export → Markdown & CSV, rồi thả file .zip (hoặc file .csv đã giải nén) vào đây. Không cần ghép cột: app tự nhận ra cột nào là gì từ nội dung."
  en: "Database → ••• → Export → Markdown & CSV, then drop the .zip file (or the unzipped .csv file) here. No column mapping needed: the app works out what each column is from its content."
data_sources.notion.drop:
  vi: "Kéo thả file ZIP hoặc CSV của Notion vào đây"
  en: "Drop the Notion ZIP or CSV file here"
data_sources.notion.drop_hint:
  vi: "Nhận file .zip (kèm ảnh) hoặc .csv"
  en: "Takes a .zip (with pictures) or a .csv"
data_sources.notion.processing:
  vi: "Đang xử lý…"
  en: "Processing…"
data_sources.notion.read_stopped:
  vi: "Luồng đọc file bị dừng: %{error}"
  en: "The file-reading task stopped: %{error}"
data_sources.api.no_token:
  vi: "Chưa có token Notion: dán token rồi bấm «Lưu token & tải danh sách»."
  en: "No Notion token yet: paste the token and press “Save token & load list”."
data_sources.api.stopped:
  vi: "Luồng Notion bị dừng: %{error}"
  en: "The Notion task stopped: %{error}"
data_sources.api.title:
  vi: "Kết nối Notion (API)"
  en: "Connect Notion (API)"
data_sources.api.body:
  vi: "Không cần xuất file: tạo integration nội bộ tại notion.so/my-integrations (chỉ cần quyền đọc nội dung), chia sẻ database nhật ký cho nó (••• → Connections), rồi dán token vào đây. Token chỉ nằm trong kho khoá của hệ điều hành, không nằm trong file dữ liệu."
  en: "No file export needed: create an internal integration at notion.so/my-integrations (read-content permission is enough), share your journal database with it (••• → Connections), then paste the token here. The token is kept only in the operating system’s credential store, never in the data file."
data_sources.api.token:
  vi: "Token tích hợp Notion"
  en: "Notion integration token"
data_sources.api.token_placeholder:
  vi: "ntn_… hoặc secret_…"
  en: "ntn_… or secret_…"
