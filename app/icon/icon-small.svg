<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- TradeLens app icon, simplified for 16-32 px: thicker rim and handle, one rising
       line instead of candles so it stays readable on the taskbar. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="200" fill="url(#tile)"/>

  <path d="M650 650 L840 840" stroke="#04201c" stroke-width="150" stroke-linecap="round"/>
  <circle cx="440" cy="440" r="250" fill="#0b0e14"/>
  <path d="M300 540 L410 430 L490 500 L590 370" fill="none" stroke="#34d399" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="440" cy="440" r="250" fill="none" stroke="#04201c" stroke-width="96"/>
</svg>
